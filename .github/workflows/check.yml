name: Check website
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:services
      - run: npm run test:geometry
      - run: npm run build
      - run: python3 scripts/verify-public-output.py
      - run: npx playwright install --with-deps chromium
      - name: Verify portfolio, venture experiences and native alternatives
        run: |
          node scripts/preview.mjs --host 127.0.0.1 --port 4173 > /tmp/nrth-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          if ! node scripts/wait-preview.mjs; then
            cat /tmp/nrth-preview.log
            exit 1
          fi
          export CHROMIUM_PATH="$(node -e "process.stdout.write(require('@playwright/test').chromium.executablePath())")"
          npm run test:baseline
          npm run test:ventures
          npm run test:guides
        env:
          NRTH_TEST_URL: http://127.0.0.1:4173
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
        working-directory: studio
      - run: npm run check
        working-directory: studio
      - run: npm run build
        working-directory: studio
        env:
          SANITY_STUDIO_PROJECT_ID: nrthdemo
          SANITY_STUDIO_DATASET: production
          SANITY_CLI_TELEMETRY_DISABLED: '1'
